name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # These are Serel Kit's own integrity checks: the installer, and the rule
    # that every pack ships both adapters. They are meaningless in a repo that
    # merely installed a pack, so the job self-disables outside this repository.
    if: github.repository == 'madeordinary/serel-kit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Pinned ShellCheck and all pack suites
        run: bash tests/ci.sh checks

  docs:
    # Markdown hygiene for the prompt files themselves. Same repo guard.
    if: github.repository == 'madeordinary/serel-kit'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .github/ci/node-version
          package-manager-cache: false

      - name: Locked Markdown lint
        run: bash tests/ci.sh docs
